<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dfc878">
  <title>LETOMEET — школьные события</title>
  <script src="{{ url_for('static', filename='theme.js', v='20261123k') }}"></script>
  <script src="{{ url_for('static', filename='trending.js', v='20261123k') }}" defer></script>
  <script src="{{ url_for('static', filename='sharing.js', v='20261123k') }}" defer></script>
  <script src="{{ url_for('static', filename='cropper.js', v='20261123k') }}" defer></script>
  <script src="{{ url_for('static', filename='profile.js', v='20261123k') }}" defer></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20261123k') }}">
  <script src="{{ url_for('static', filename='script.js', v='20261123k') }}" defer></script>
</head>
<body>
  <header>
    <a class="logo" href="#home" aria-label="LETOMEET — каталог и создание событий">
      LETOMEET
    </a>

    <nav aria-label="Навигация" id="navigation" hidden>
      <a href="#map">Карта событий</a>
      <a href="#welcome">Главная страница</a>
      <a href="#catalog">Список событий</a>
      <a href="#create">Добавить событие</a>
    </nav>

    <div id="auth-panel"></div>
    <button id="theme-toggle" type="button" aria-label="Тёмная тема" aria-pressed="false" title="Включить тёмную тему">☾</button>
  </header>

  <main id="content"></main>

  <dialog id="contacts">
    <div class="dialog-heading">
      <h2>Ты в списке!</h2>
      <button id="close-dialog" class="plain" aria-label="Закрыть">×</button>
    </div>
    <p>Договориться о деталях можно здесь:</p>
    <div id="dialog-links"></div>
    <button id="done-dialog" class="primary">Понятно</button>
  </dialog>
</body>
</html>
